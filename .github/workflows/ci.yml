name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run pytest --cov=fx_system --cov-report=term-missing
      - run: uv run fxtrade validate-config -c configs/default.yaml
      - run: uv run python -c "from fx_system.factor_config import FactorMiningConfig; FactorMiningConfig.from_yaml('configs/factors_daily.yaml')"
      - run: uv run fxtrade backtest -c configs/demo.yaml -o outputs/ci-smoke
