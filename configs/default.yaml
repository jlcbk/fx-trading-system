data:
  provider: csv
  directory: data
  symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, NZDUSD, USDCAD]
  interval: 4h
  start: "2024-07-16"
  end: null
  seed: 42
  synthetic_bars: 5000

costs:
  default_spread_pips: 0.9
  spread_pips:
    EURUSD: 0.7
    GBPUSD: 0.9
    USDJPY: 0.8
    USDCHF: 1.0
    AUDUSD: 0.9
    NZDUSD: 1.2
    USDCAD: 1.0
  slippage_pips: 0.15
  commission_per_million: 35.0
  daily_swap_pips_long: {}
  daily_swap_pips_short: {}

risk:
  initial_equity: 100000
  risk_per_trade: 0.003
  max_portfolio_risk: 0.015
  max_open_positions: 5
  max_gross_leverage: 3.0
  max_currency_exposure: 1.5
  max_correlated_positions: 2
  correlation_threshold: 0.80
  correlation_lookback: 120
  max_drawdown: 0.12
  daily_loss_limit: 0.025
  max_reward_risk: 0.85
  max_holding_hours: 168
  unit_step: 1000
  min_units: 1000
  close_before_weekend: true

strategies:
  - name: regime_mean_reversion
    weight: 1.20
    params: {lookback: 30, entry_z: 1.65, target_atr: 0.72, stop_atr: 1.15}
  - name: trend_pullback
    weight: 1.00
    params: {fast: 20, slow: 60, target_atr: 0.90, stop_atr: 1.25}
  - name: session_breakout
    weight: 0.85
    params: {target_atr: 0.78, stop_atr: 1.20}
  - name: false_breakout_reversal
    weight: 1.00
    params: {range_bars: 18, target_atr: 0.68, stop_atr: 1.10}
  - name: currency_strength_reversion
    weight: 1.15
    params: {lookback: 18, strength_z: 1.25, pair_z: 1.35}
  - name: cointegration_spread
    weight: 0.80
    params:
      pairs: [[EURUSD, GBPUSD], [AUDUSD, NZDUSD]]
      lookback: 180
      entry_z: 2.0

ensemble:
  minimum_vote: 0.50
  minimum_confidence: 0.50
  disagreement_penalty: 0.25

output:
  directory: outputs/latest
  save_signals: true
