amendments:
  - id: local_paper_contract_correction_20260716
    hypothesis_id: intraday_local_session_exact
    amended_at: 2026-07-16T04:21:16+08:00
    market_data_cutoff: 2026-07-13
    market_outcomes_inspected_since_registration: false
    reason: >-
      Full-text verification of Breedon and Ranaldo was completed before any Dukascopy
      outcomes were read. Table 2 is a 12-unit pair-session panel, applies an open-to-open
      endpoint when the later market opens before the first closes, includes holidays when
      quotes exist, applies pair-specific UTC weekend boundaries, and does not define a
      six-pair portfolio.
    changes:
      - Replace the full-session replica with the paper's fixed 12 pair-session units and its open-to-open overlap rule.
      - Keep every supplied natural date visible and include holidays with qualifying quotes, but require both unit boundaries to fall inside the paper's pair-specific UTC working week.
      - For EURUSD, GBPUSD, and USDCHF exclude Saturday 00:00--Sunday 00:00 UTC; for USDJPY, EURJPY, and AUDUSD exclude Saturday 00:00--18:00 UTC.
      - Use the last prevailing bid and ask at or before each boundary within five seconds; executable bid/ask is primary and midquote is secondary.
      - Treat the complete six-pair portfolio as a separately labelled project extension with six fixed one-sixth sleeves, all 12 units required, and no missing-leg renormalization.
      - Use Europe/London as the IANA implementation of the paper's Dublin-equivalent clock and follow the stated base-versus-counter direction rule for EURJPY despite the paper table's sign inconsistency.
    evidence_reference_ids: [fx_intraday_patterns, fx_liquidity]

