[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fx-portfolio-system"
version = "0.4.0"
description = "Multi-currency FX research, backtesting, risk and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local FX Research" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "yfinance>=0.2.54,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.6,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
research = ["optuna>=4,<5"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
fxtrade = "fx_system.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
